name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint et tests JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version de package.json inédite et supérieure aux tags
        if: github.event_name == 'pull_request'
        run: node scripts/verifier-version.js
      - run: npm run lint
      - run: npm test

  android:
    name: Lint, tests et build Android
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug
        working-directory: android
