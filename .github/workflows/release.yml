name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    name: APK et release GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Version inédite et supérieure aux tags
        run: node scripts/verifier-version.js
      - run: npm run check
      - run: npx cap sync android
      - name: Fabriquer l'APK signé
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          VERSION=$(node -p "require('../package.json').version")
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          CODE=$(node -p "require('../www/utils.js').versionCode('$TAG')")
          test "$CODE" != "null" || { echo "Tag invalide : attendu vX.Y.Z"; exit 1; }
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
        working-directory: android
      - name: Créer la release avec l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "registre-vehicules-${TAG}.apk"
          gh release create "$TAG" "registre-vehicules-${TAG}.apk" \
            --title "$TAG" --target "$GITHUB_SHA" --generate-notes
